apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: rbac-demo-dev
namePrefix: dev-

replicas:
  - name: app
    count: 2

images:
  - name: nginx
    newName: nginx
    newTag: "1.24-alpine"

labels:
  - pairs:
      environment: dev
    includeSelectors: false

patches:
  - path: patch.yaml
    target:
      kind: Deployment
      name: app
