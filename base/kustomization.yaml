apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rbac-demo

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      part-of: rbac-demo
    includeSelectors: false
